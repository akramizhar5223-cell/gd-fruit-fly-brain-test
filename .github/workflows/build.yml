name: Build Mod
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: Win64
          - os: ubuntu-latest
            target: Android64
          - os: macos-14
            target: MacOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Build mod
        uses: geode-sdk/build-geode-mod@main
        with:
          target: ${{ matrix.target }}
          sdk: latest
          cli: latest

      - uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.target }}
          path: ${{ steps.build.outputs.build-output }}

  combine:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: mod-*
          merge-multiple: true

      - name: Combine builds
        uses: geode-sdk/build-geode-mod/combine@main

      - uses: actions/upload-artifact@v4
        with:
          name: FlyBrainAI-Mod
          path: ${{ steps.combine.outputs.combined-output }}
